name: test

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Rule engine checks
        run: node test/engine-check.cjs
      - name: Registration and render smoke test
        run: node test/smoke.cjs